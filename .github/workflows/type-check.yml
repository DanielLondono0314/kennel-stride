name: Type Check – TypeScript

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler (no emit)
        # Uses tsconfig.app.json which covers the src/ tree.
        # --noEmit means we only check types – no output files are written.
        run: npx tsc --project tsconfig.app.json --noEmit
